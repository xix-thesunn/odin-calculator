<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ｃａｌｃｕｌａｔｏｒ</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="workspace">
        <div class="history">
            <p>8 + 2 = 10</p>
            <p>19 × 32 = 608</p>
            <p>608 ÷ 19 = 32</p>
            <p>2 + 2 = 4</p>
        </div>
        <div class="calc">
            <div class="numpad">
                <div id="display">0,7831808</div>

                <button id="one">1</button>
                <button id="two">2</button>
                <button id="three">3</button>
                <button id="four">4</button>
                <button id="five">5</button>
                <button id="six">6</button>
                <button id="seven">7</button>
                <button id="eight">8</button>
                <button id="nine">9</button>
                <button id="zero">0</button>

                <button id="point">.</button>
                <button id="multiply" class="operator">×</button>
                <button id="divide" class="operator">÷</button>
                <button id="minus" class="operator">-</button>
                <button id="plus" class="operator">+</button>
                <button id="equal">=</button>
                <button id="clear" class="cancellation">C</button>
                <button id="backspace" class="cancellation">DEL</button>
            </div>
        </div>
        <div class="empty"></div>
    </div>
    <p class="title">— Made within <a href="https://www.theodinproject.com/">The Odin Project</a> —</p>
</body>
</html>
